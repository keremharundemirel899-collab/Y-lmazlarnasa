<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abandoned But Not Forgotten - Moon and Mars Heritage Observatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<!--
======================================================================
ARCHITECTURAL BLUEPRINT  (NASA Space Apps - "Abandoned But Not Forgotten")
Scope: Moon + Mars. Single page, three modules loaded by relative path.
  js/i18n.js   Phase 1  Zero-reload dictionary: TR EN ZH HI ES FR
  js/data.js   Phase 1  Bodies, 5 categories, 27 spacecraft with multi-step
                        histories, Discover dossiers, model links
  js/app.js    Phase 2  3D WebGL loader (LCROSS Centaur impact on Cabeus)
               Phase 3  Engine: procedural planets, detailed procedural
                        spacecraft, orbits, labels, camera rig, planet
                        transit screen, per-planet theming, GLTF hooks
               Phase 4  Mission-control UI: catalog, telemetry panel with
                        tabs, model inspector, timeline, simulator
               Phase 5  Attribution badge, bibliography, Discover dossiers
======================================================================
-->
<style>
:root{
  --bg:#03060b; --glass:rgba(8,14,24,.62); --glass-2:rgba(12,20,34,.82);
  --line:rgba(var(--accent-rgb),.16); --line-2:rgba(var(--accent-rgb),.34);
  --white:#eef3f8; --dim:#8ea0b4; --dimmer:#5b6b7e; --red:#ff6a55; --green:#7cf2b0;
  --sans:'IBM Plex Sans','IBM Plex Sans Devanagari','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;
  --display:'Space Grotesk','IBM Plex Sans','IBM Plex Sans Devanagari','PingFang SC',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
body[data-theme=moon]{--accent:#7fd6ff;--accent-rgb:127,214,255;--accent-2:#dfe9f3;--warm:#ffd27a;--warm-rgb:255,210,122;--tint:rgba(70,130,190,.12)}
body[data-theme=mars]{--accent:#ff9461;--accent-rgb:255,148,97;--accent-2:#ffdcc4;--warm:#ffe08a;--warm-rgb:255,224,138;--tint:rgba(200,80,40,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);color:var(--accent);padding:2px 8px;border-radius:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--dim);border:1px solid var(--line);transition:.2s}
.icon-btn:hover{color:var(--white);border-color:var(--line-2);background:rgba(var(--accent-rgb),.06)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,var(--tint),transparent 40%,transparent 70%,var(--tint));transition:background 1.2s}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;padding:4px 9px 4px 6px;border-radius:7px;background:rgba(4,9,16,.6);border:1px solid var(--line);white-space:nowrap;transform:translate(-9999px,0);transition:border-color .2s,background .2s,opacity .3s}
.lbl i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.lbl .code{font-family:var(--mono);color:var(--accent);font-size:10px}
.lbl.sel{border-color:var(--warm);background:rgba(40,26,6,.75)}
.lbl.sel .code{color:var(--warm)}
.lbl.sel i{background:var(--warm);box-shadow:0 0 10px var(--warm)}
.lbl.lost i{background:var(--red);box-shadow:0 0 8px var(--red)}
.lbl:hover{border-color:var(--line-2)}

/* ================= LOADER ================= */
#loader{position:fixed;inset:0;z-index:100;transition:opacity 1.2s ease,background 1.2s}
#loader.boot{background:#000}
#loader.fade{opacity:0;pointer-events:none}
.ld-boot{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:1px solid rgba(255,255,255,.08);transition:opacity .6s}
.ld-boot::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;border-top-color:var(--accent);animation:spin 1.1s linear infinite}
#loader:not(.boot) .ld-boot{opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-top{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.ld-brand b{display:block;font-family:var(--display);font-weight:500;font-size:16px;letter-spacing:.26em}
.ld-brand span{font-size:11px;color:var(--dim);letter-spacing:.24em;text-transform:uppercase}
.ld-lang{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ld-lang > span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--dim);background:rgba(0,0,0,.35);backdrop-filter:blur(8px);transition:.2s}
.chip:hover{color:var(--white);border-color:var(--line-2)}
.chip.on{color:#05090f;background:var(--accent);border-color:var(--accent)}
.ld-hud{position:absolute;left:30px;bottom:30px;width:min(460px,calc(100vw - 60px))}
.ld-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-bottom:10px}
.ld-pct{font-family:var(--display);font-size:84px;font-weight:500;line-height:.9;letter-spacing:-.03em}
.ld-pct small{font-size:24px;color:var(--dim);margin-left:6px;font-family:var(--mono)}
.ld-bar{height:2px;background:rgba(255,255,255,.08);margin:16px 0;position:relative;overflow:hidden;border-radius:2px}
.ld-bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--accent),var(--warm));box-shadow:0 0 12px var(--accent)}
.ld-tele{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ld-tele div{border-left:1px solid var(--line-2);padding-left:10px}
.ld-tele label{display:block;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.ld-tele b{font-family:var(--mono);font-weight:500;font-size:17px}
.ld-tele em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:4px}
.ld-stage{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.ld-stage::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:blink 1s infinite}
.ld-stage.hit{color:var(--warm)}
@keyframes blink{50%{opacity:.25}}
#ldSkip{position:absolute;right:30px;bottom:30px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);padding:8px 16px;border-radius:999px;text-transform:uppercase;background:rgba(0,0,0,.3)}
#ldSkip:hover{color:var(--white);border-color:var(--line-2)}
#ldFlash{position:absolute;inset:0;background:radial-gradient(circle at var(--fx,60%) var(--fy,60%),#fff 0,rgba(255,244,220,.9) 10%,rgba(255,190,110,.3) 32%,transparent 60%);opacity:0;pointer-events:none}
#ldError{position:absolute;left:30px;right:30px;top:110px;color:var(--red);font-family:var(--mono);font-size:13px;display:none}
.ld-reticle{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border:1px solid var(--warm);border-radius:50%;opacity:0;transition:opacity .4s;pointer-events:none}
.ld-reticle::before,.ld-reticle::after{content:'';position:absolute;background:var(--warm)}
.ld-reticle::before{left:50%;top:-10px;width:1px;height:10px}
.ld-reticle::after{top:50%;left:-10px;width:10px;height:1px}
.ld-reticle span{position:absolute;left:66px;top:-4px;white-space:nowrap;font-family:var(--mono);font-size:10px;color:var(--warm);letter-spacing:.08em}

/* ================= TRANSIT ================= */
#transit{position:fixed;inset:0;z-index:80;pointer-events:none;opacity:0;transition:opacity .45s ease}
#transit.on{opacity:1;pointer-events:auto}
#warp{position:absolute;inset:0;width:100%;height:100%}
.tr-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(560px,calc(100vw - 40px));padding:28px 30px;transition:transform .8s var(--ease)}
#transit.on .tr-card{transform:translate(-50%,-50%) scale(1)}
.tr-kicker{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.tr-card h2{font-family:var(--display);font-weight:500;font-size:64px;letter-spacing:-.02em;margin:10px 0 2px;line-height:1}
.tr-card p{color:var(--dim);font-size:14px}
.tr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 18px}
.tr-stats div{border-top:1px solid var(--line-2);padding-top:8px}
.tr-stats label{display:block;font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tr-stats b{font-family:var(--mono);font-weight:500;font-size:15px}
.tr-bar{height:2px;background:rgba(255,255,255,.08);overflow:hidden;border-radius:2px}
.tr-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--warm))}
#transit.on .tr-bar i{width:100%;transition:width 2.4s linear}

/* ================= APP UI ================= */
#ui{transition:opacity 1s ease}
body:not(.ready) #ui{opacity:0;pointer-events:none}
.topbar{position:fixed;top:14px;left:14px;right:14px;height:62px;z-index:30;display:flex;align-items:center;gap:14px;padding:0 12px 0 16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand svg{width:32px;height:32px;stroke:var(--accent);fill:none;stroke-width:1.2;flex:none}
.brand h1{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font-size:11px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#worldNav{display:flex;gap:6px;padding:4px;border-radius:13px;background:rgba(0,0,0,.28);border:1px solid var(--line)}
.world{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 8px;border-radius:10px;color:var(--dim);transition:.25s}
.world:hover{color:var(--white)}
.world.on{background:rgba(var(--accent-rgb),.14);color:var(--white);box-shadow:inset 0 0 0 1px var(--line-2)}
.world .orb{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -6px -4px 10px rgba(0,0,0,.6)}
.world[data-body=MOON] .orb{background:radial-gradient(circle at 35% 35%,#e9e7e2,#8e8c88 55%,#3a3937)}
.world[data-body=MARS] .orb{background:radial-gradient(circle at 35% 35%,#f2a679,#b4552c 55%,#4d1c0d)}
.world b{display:block;font-size:13px;font-weight:500;text-align:left}
.world small{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);text-align:left}
.actions{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;color:var(--accent-2);transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:rgba(var(--accent-rgb),.08)}
.lang-wrap{position:relative}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:180px;padding:6px;display:none;z-index:40}
.lang-menu.on{display:block}
.lang-menu button{display:flex;justify-content:space-between;width:100%;padding:9px 11px;border-radius:8px;font-size:13px;color:var(--dim)}
.lang-menu button:hover{background:rgba(var(--accent-rgb),.08);color:var(--white)}
.lang-menu button.on{color:var(--accent)}
.lang-menu button span{font-family:var(--mono);font-size:11px}

#readouts{position:fixed;top:88px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:18px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em;pointer-events:none;white-space:nowrap}
#readouts b{color:var(--white);font-weight:500}

#catalog{position:fixed;left:14px;top:90px;bottom:126px;width:310px;z-index:10;display:flex;flex-direction:column;overflow:hidden;transition:transform .4s var(--ease)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.searchbox{margin:0 12px 10px;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--dim)}
.searchbox input{flex:1;min-width:0;font-size:13px;color:var(--white);outline:none}
.searchbox input::placeholder{color:var(--dimmer)}
#catChips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px;border-bottom:1px solid var(--line)}
#catChips .chip{font-size:11px;padding:5px 10px;background:transparent;backdrop-filter:none}
#catChips .chip.on{background:var(--accent);color:#05090f}
#catList{flex:1;padding:6px 8px 12px}
.cat-h{padding:14px 8px 6px;font-size:10.5px;color:var(--warm);letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.cat-h span:last-child{font-family:var(--mono);color:var(--dimmer)}
.item{width:100%;text-align:left;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:9px 8px;border-radius:10px;border:1px solid transparent;transition:.2s}
.item:hover{background:rgba(var(--accent-rgb),.06)}
.item.on{background:rgba(var(--warm-rgb),.08);border-color:rgba(var(--warm-rgb),.38)}
.item .code{font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.item.on .code{color:var(--warm)}
.item .nm{display:block;font-size:13px;line-height:1.25}
.item .meta{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dimmer)}
.dot.op{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.dead{background:var(--warm)}
.dot.lost{background:var(--red)}
.item.future{opacity:.35}
.empty{padding:22px 12px;color:var(--dim);font-size:13px}
.hint{padding:10px 16px 14px;font-size:10.5px;color:var(--dimmer);border-top:1px solid var(--line)}

#panel{position:fixed;right:14px;top:90px;bottom:126px;width:400px;z-index:12;display:flex;flex-direction:column;overflow:hidden}
#panelScroll{flex:1}
.p-head{padding:16px 18px 6px}
.p-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.p-head h2{font-family:var(--display);font-weight:500;font-size:26px;line-height:1.1;margin:8px 0 10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--accent)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.dead{border-color:rgba(var(--warm-rgb),.5);color:var(--warm)}
.pill.lost{border-color:rgba(255,106,85,.5);color:var(--red)}
.pill.op{border-color:rgba(124,242,176,.5);color:var(--green)}
.pill.pre{border-color:var(--line);color:var(--dim)}
.p-close{position:absolute;right:12px;top:12px}
#inspWrap{position:relative;margin:8px 18px 4px;height:210px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 70%,rgba(var(--accent-rgb),.1),transparent 70%),rgba(0,0,0,.25)}
#inspector{width:100%;height:100%;display:block}
.insp-cap{position:absolute;left:10px;top:9px;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.insp-actions{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px}
.insp-actions a,.insp-actions label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:10.5px;color:var(--accent-2);padding:7px 8px;border-radius:8px;border:1px solid var(--line-2);background:rgba(0,0,0,.45);cursor:pointer;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-actions a:hover,.insp-actions label:hover,#inspWrap.over label{border-color:var(--accent);color:var(--white)}
.insp-actions input{display:none}
.tabs{display:flex;gap:4px;margin:10px 18px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 12px;font-size:12.5px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--white);border-color:var(--accent)}
.tab{padding:6px 18px 14px}
.f{padding:11px 0;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f label{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.f div{font-size:13.5px;line-height:1.55}
.f .num{font-family:var(--mono);font-size:12.5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chron{list-style:none;position:relative;padding:8px 0 4px 22px}
.chron::before{content:'';position:absolute;left:6px;top:14px;bottom:14px;width:1px;background:linear-gradient(var(--accent),var(--warm))}
.chron li{position:relative;padding:8px 0 12px}
.chron li::before{content:'';position:absolute;left:-20px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--accent)}
.chron li:last-child::before{border-color:var(--warm);background:var(--warm)}
.chron time{display:block;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.04em}
.chron p{font-size:13.5px;line-height:1.5;margin-top:3px}
.chron li.future{opacity:.4}
.src{display:grid;gap:8px;margin-top:6px}
.src a{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px;text-decoration:none;transition:.2s}
.src a:hover{border-color:var(--line-2);background:rgba(var(--accent-rgb),.06)}
.src a b{font-weight:500;color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.src a span{font-family:var(--mono);font-size:11.5px;color:var(--accent);word-break:break-all}
.note{margin-top:12px;font-size:11.5px;color:var(--dimmer);line-height:1.6}
.p-actions{padding:12px 18px 16px;border-top:1px solid var(--line)}
.primary{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:12px;font-size:13px;letter-spacing:.04em;background:linear-gradient(180deg,rgba(var(--warm-rgb),.2),rgba(var(--warm-rgb),.08));border:1px solid rgba(var(--warm-rgb),.55);color:#fff3dc;transition:.2s}
.primary:hover{background:linear-gradient(180deg,rgba(var(--warm-rgb),.3),rgba(var(--warm-rgb),.14))}
.primary:disabled{opacity:.4;cursor:not-allowed}
.p-actions small{display:block;text-align:center;margin-top:8px;font-size:10.5px;color:var(--dim)}
/* body overview */
.bo{padding:20px 20px 10px}
.bo-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
.bo h2{font-family:var(--display);font-size:52px;font-weight:500;letter-spacing:-.02em;line-height:1;margin:8px 0 4px}
.bo .sub{color:var(--dim);font-size:13px}
.bo .intro{margin-top:16px;font-size:14px;line-height:1.65;color:#d5dde6}

    <nav id="worldNav" aria-label="World">
      <button class="world" data-body="MOON"><span class="orb"></span><span><b data-i18n="moon"></b><small id="wnMOON"></small></span></button>
      <button class="world" data-body="MARS"><span class="orb"></span><span><b data-i18n="mars"></b><small id="wnMARS"></small></span></button>
    </nav>
    <div class="actions">
      <button class="btn" id="btnDiscover"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M10.5 5.5L9 9 5.5 10.5 7 7z"/></svg><span class="t" data-i18n="discover"></span></button>
      <button class="btn" id="btnSources"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 3h4a1.5 1.5 0 0 1 1.5 1.5V13a1 1 0 0 0-1-1H2.5zM13.5 3h-4A1.5 1.5 0 0 0 8 4.5V13a1 1 0 0 1 1-1h4.5z"/></svg><span class="t" data-i18n="sources"></span></button>
      <div class="lang-wrap">
        <button class="btn" id="btnLang" aria-haspopup="menu"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg><span id="langCur" class="mono"></span></button>
        <div class="lang-menu glass" id="langMenu" role="menu"></div>
      </div>
    </div>
  </header>

  <div id="readouts">
    <span>UTC <b id="roClock">--</b></span>
    <span><span data-i18n="range"></span> <b id="roRange">--</b></span>
    <span id="roBody"></span>
  </div>

  <button id="catToggle" class="icon-btn" aria-label="Catalog"><svg class="i" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h10"/></svg></button>
  <aside id="catalog" class="glass">
    <div class="panel-head"><span data-i18n="catalog"></span><span class="mono" id="catCount"></span></div>
    <label class="searchbox"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="search" type="search" autocomplete="off"></label>
    <div id="catChips"></div>
    <div id="catList" class="scroll"></div>
    <p class="hint" data-i18n="dragHint"></p>
  </aside>

  <aside id="panel" class="glass">
    <div id="panelScroll" class="scroll">
      <div id="pHead"></div>
      <div id="inspWrap">
        <canvas id="inspector"></canvas>
        <span class="insp-cap" id="inspCap"></span>
      </div>
      <div id="pBody"></div>
    </div>
    <div class="p-actions" id="pActions">
      <button id="simBtn" class="primary"><svg class="i" viewBox="0 0 16 16"><path d="M2 3c5 0 9 3 11 9"/><circle cx="13" cy="12.5" r="1.6"/><path d="M10 14.5l6-1M12 10l1.5-2"/></svg><span data-i18n="simulate"></span></button>
      <small id="simMode"></small>
    </div>
  </aside>

  <div id="simHud" class="glass" hidden></div>

  <footer id="timeline" class="glass">
    <button id="playBtn" class="icon-btn" aria-label="Play"></button>
    <div class="tl-main">
      <div class="tl-top"><span data-i18n="timeline"></span><span class="year" id="yearOut">2026</span>
        <span class="cnt"><span id="cntLabel"></span> <b id="cntOut">--</b></span></div>
      <div class="tl-track"><canvas id="tlHist"></canvas><input type="range" id="yearRange" min="1957" max="2026" step="1" value="2026" aria-label="Year"></div>
      <div class="tl-axis"><span>1957</span><span>1970</span><span>1980</span><span>1990</span><span>2000</span><span>2010</span><span>2026</span></div>
    </div>
  </footer>

  <!-- ================= PHASE 5: ATTRIBUTION ================= -->
  <button id="attrib" class="glass" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h6a2 2 0 0 1 2 2V20a1.5 1.5 0 0 0-1.5-1.5H4z"/><path d="M20 4.5h-6a2 2 0 0 0-2 2V20a1.5 1.5 0 0 1 1.5-1.5H20z"/></svg>
    <span class="a1"><b data-i18n="sources"></b>NASA / Wikipedia</span>
    <span class="a2"><i>nssdc.gsfc.nasa.gov</i><i>science.nasa.gov</i><i>ssd.jpl.nasa.gov</i><i>en.wikipedia.org</i></span>
  </button>

  <div class="modal" id="bibModal" role="dialog" aria-modal="true">
    <div class="modal-card glass">
      <div class="m-head"><div><h3 data-i18n="biblio"></h3><p data-i18n="bibIntro"></p></div>
        <button class="icon-btn" data-close="bib" aria-label="Close"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
      <div class="m-body scroll" id="bibBody"></div>
    </div>
  </div>
  <div class="modal" id="dosModal" role="dialog" aria-modal="true">
    <div class="modal-card glass">
      <div class="m-head"><div><h3 data-i18n="discover"></h3><p data-i18n="discoverSub"></p></div>
        <button class="icon-btn" data-close="dos" aria-label="Close"><svg class="i" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
      <div class="m-body scroll" id="dosBody"></div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/story.js"></script>
<script src="js/app.js"></script>
</body>
</html>
